name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Gradle Configs
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/example/gametranslator
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          printf 'pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = "GameTranslator"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins {\n  id("com.android.application") version "8.2.0" apply false\n  id("org.jetbrains.kotlin.android") version "1.9.20" apply false\n}\n' > build.gradle.kts
          printf 'plugins {\n  id("com.android.application")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.example.gametranslator"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.example.gametranslator"\n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = "17"\n  }\n}\n' > app/build.gradle.kts
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <uses-permission android:name="android.permission.INTERNET" />\n  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n  <application android:allowBackup="true" android:label="Gaminik AI Free" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n    <service android:name=".FloatingTranslateService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaProjection" />\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

      - name: Create MainActivity.kt
        run: |
          python3 -c '
          code = """package com.example.gametranslator

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.util.Base64
          import android.view.*
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          class MainActivity : Activity() {
              private lateinit var projMgr: MediaProjectionManager
              private lateinit var edtApiKey: EditText
              private lateinit var edtContext: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val prefs = getSharedPreferences("config", MODE_PRIVATE)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 80, 48, 48)
                      setBackgroundColor(Color.parseColor("#121212"))
                  }

                  val title = TextView(this).apply {
                      text = "GAMINIK AI FREE"
                      textSize = 22f
                      setTextColor(Color.parseColor("#00FF9D"))
                  }

                  edtApiKey = EditText(this).apply {
                      hint = "Dan Gemini API Key vao day"
                      setText(prefs.getString("api_key", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                  }

                  edtContext = EditText(this).apply {
                      hint = "Ngu canh game (VD: Game RPG tieng Anh)"
                      setText(prefs.getString("context", "Game RPG tieng Anh, dich tu nhien dung ngu canh."))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                  }

                  val btnStart = Button(this).apply {
                      text = "BAT KHUNG DICH LEN MAN HINH"
                      setBackgroundColor(Color.parseColor("#2EA043"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { startTranslator() }
                  }

                  val btnStop = Button(this).apply {
                      text = "TAT KHUNG DICH"
                      setBackgroundColor(Color.parseColor("#D73A49"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { stopService(Intent(this@MainActivity, FloatingTranslateService::class.java)) }
                  }

                  layout.addView(title)
                  layout.addView(edtApiKey)
                  layout.addView(edtContext)
                  layout.addView(btnStart)
                  layout.addView(btnStop)
                  setContentView(layout)
              }

              private fun startTranslator() {
                  val key = edtApiKey.text.toString().trim()
                  if (key.isEmpty()) {
                      Toast.makeText(this, "Vui long nhap Gemini API Key!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  getSharedPreferences("config", MODE_PRIVATE).edit()
                      .putString("api_key", key)
                      .putString("context", edtContext.text.toString().trim())
                      .apply()

                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      Toast.makeText(this, "Hay cap quyen Hien thi tren ung dung khac!", Toast.LENGTH_LONG).show()
                      return
                  }
                  startActivityForResult(projMgr.createScreenCaptureIntent(), 1001)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      val svc = Intent(this, FloatingTranslateService::class.java).apply {
                          putExtra("resultCode", resultCode)
                          putExtra("data", data)
                      }
                      startForegroundService(svc)
                      moveTaskToBack(true)
                  }
              }
          }

          class FloatingTranslateService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var frameLayout: LinearLayout
              private lateinit var tvResult: TextView
              private lateinit var params: WindowManager.LayoutParams
              private var mediaProjection: MediaProjection? = null
              private var imageReader: ImageReader? = null
              private var virtualDisplay: VirtualDisplay? = null
              private val executor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startEnforcedForeground()
                  val resultCode = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  @Suppress("DEPRECATION")
                  val data = intent.getParcelableExtra<Intent>("data") ?: return START_NOT_STICKY

                  val projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = projMgr.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {}, mainHandler)
                  setupVirtualDisplay()
                  if (!::wm.isInitialized) setupFloatingBox()
                  return START_NOT_STICKY
              }

              private fun startEnforcedForeground() {
                  val channelId = "game_trans_channel"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(channelId, "Game Translator", NotificationManager.IMPORTANCE_LOW))
                  val notif = Notification.Builder(this, channelId)
                      .setContentTitle("Khung dich AI dang chay")
                      .setSmallIcon(android.R.drawable.ic_menu_search)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun setupVirtualDisplay() {
                  val metrics = resources.displayMetrics
                  imageReader = ImageReader.newInstance(metrics.widthPixels, metrics.heightPixels, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "ScreenCap", metrics.widthPixels, metrics.heightPixels, metrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader?.surface, null, null
                  )
              }

              private fun setupFloatingBox() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  params = WindowManager.LayoutParams(
                      850, 320,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 400
                  }

                  frameLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#B3000000"))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#1F6FEB"))
                      setPadding(16, 8, 16, 8)
                  }

                  val btnMove = TextView(this).apply {
                      text = "[Keo] "
                      setTextColor(Color.WHITE)
                      textSize = 14f
                  }

                  val btnTrans = Button(this).apply {
                      text = "DICH VUNG NAY"
                      setBackgroundColor(Color.parseColor("#2EA043"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { captureAndTranslate() }
                  }

                  val btnClear = Button(this).apply {
                      text = "An chu"
                      setOnClickListener {
                          tvResult.text = ""
                          frameLayout.setBackgroundColor(Color.parseColor("#3300FF9D"))
                      }
                  }

                  val btnResize = TextView(this).apply {
                      text = " [Keo rong]"
                      setTextColor(Color.YELLOW)
                      textSize = 14f
                  }

                  header.addView(btnMove)
                  header.addView(btnTrans)
                  header.addView(btnClear)
                  header.addView(btnResize)

                  tvResult = TextView(this).apply {
                      text = "Keo khung nay de len hop thoai Game roi bam [DICH VUNG NAY]"
                      setTextColor(Color.parseColor("#00FF9D"))
                      textSize = 15f
                      setPadding(16, 12, 16, 12)
                  }

                  frameLayout.addView(header)
                  frameLayout.addView(tvResult)
                  wm.addView(frameLayout, params)

                  btnMove.setOnTouchListener(object : View.OnTouchListener {
                      var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View?, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { initX = params.x; initY = params.y; touchX = e.rawX; touchY = e.rawY }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initX + (e.rawX - touchX).toInt()
                                  params.y = initY + (e.rawY - touchY).toInt()
                                  wm.updateViewLayout(frameLayout, params)
                              }
                          }
                          return true
                      }
                  })

                  btnResize.setOnTouchListener(object : View.OnTouchListener {
                      var initW = 0; var initH = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View?, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { initW = params.width; initH = params.height; touchX = e.rawX; touchY = e.rawY }
                              MotionEvent.ACTION_MOVE -> {
                                  params.width = (initW + (e.rawX - touchX).toInt()).coerceAtLeast(350)
                                  params.height = (initH + (e.rawY - touchY).toInt()).coerceAtLeast(180)
                                  wm.updateViewLayout(frameLayout, params)
                              }
                          }
                          return true
                      }
                  })
              }

              private fun captureAndTranslate() {
                  tvResult.text = "Dang chup va dich..."
                  frameLayout.visibility = View.INVISIBLE

                  mainHandler.postDelayed({
                      executor.execute {
                          try {
                              val img = imageReader?.acquireLatestImage()
                              if (img == null) {
                                  mainHandler.post {
                                      frameLayout.visibility = View.VISIBLE
                                      tvResult.text = "Khong chup duoc hinh, hay thu lai!"
                                  }
                                  return@execute
                              }
                              val plane = img.planes[0]
                              val width = img.width
                              val height = img.height
                              val pixelStride = plane.pixelStride
                              val rowStride = plane.rowStride
                              val rowPadding = rowStride - pixelStride * width

                              val fullBmp = Bitmap.createBitmap(width + rowPadding / pixelStride, height, Bitmap.Config.ARGB_8888)
                              fullBmp.copyPixelsFromBuffer(plane.buffer)
                              img.close()

                              val loc = IntArray(2)
                              frameLayout.getLocationOnScreen(loc)
                              val x = loc[0].coerceIn(0, width - 1)
                              val y = loc[1].coerceIn(0, height - 1)
                              val w = params.width.coerceAtMost(width - x).coerceAtLeast(10)
                              val h = params.height.coerceAtMost(height - y).coerceAtLeast(10)
                              val cropped = Bitmap.createBitmap(fullBmp, x, y, w, h)

                              mainHandler.post {
                                  frameLayout.visibility = View.VISIBLE
                                  frameLayout.setBackgroundColor(Color.parseColor("#CC000000"))
                              }

                              val bos = ByteArrayOutputStream()
                              cropped.compress(Bitmap.CompressFormat.JPEG, 80, bos)
                              val base64Img = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)

                              val prefs = getSharedPreferences("config", MODE_PRIVATE)
                              val apiKey = prefs.getString("api_key", "") ?: ""
                              val gameCtx = prefs.getString("context", "") ?: ""

                              val translated = callGeminiApi(apiKey, gameCtx, base64Img)
                              mainHandler.post { tvResult.text = translated }
                          } catch (e: Exception) {
                              mainHandler.post {
                                  frameLayout.visibility = View.VISIBLE
                                  tvResult.text = "Loi: " + e.message
                              }
                          }
                      }
                  }, 150)
              }

              private fun callGeminiApi(apiKey: String, gameCtx: String, base64Img: String): String {
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey)
                  val conn = url.openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.setRequestProperty("Content-Type", "application/json")
                  conn.doOutput = true

                  val prompt = "Doc chu tieng Anh trong anh va dich sang tieng Viet. Ngu canh: " + gameCtx + ". Chi tra ve cau dich tieng Viet tu nhien, khong giai thich."

                  val inlineData = JSONObject().apply {
                      put("mime_type", "image/jpeg")
                      put("data", base64Img)
                  }
                  val parts = JSONArray().apply {
                      put(JSONObject().put("text", prompt))
                      put(JSONObject().put("inline_data", inlineData))
                  }
                  val contents = JSONArray().put(JSONObject().put("parts", parts))
                  val payload = JSONObject().put("contents", contents).toString()

                  conn.outputStream.use { it.write(payload.toByteArray(Charsets.UTF_8)) }

                  val responseText = if (conn.responseCode == 200) {
                      conn.inputStream.bufferedReader().readText()
                  } else {
                      val err = conn.errorStream?.bufferedReader()?.readText() ?: "HTTP Error"
                      return "Loi API: " + err
                  }

                  val jsonRes = JSONObject(responseText)
                  return jsonRes.getJSONArray("candidates")
                      .getJSONObject(0)
                      .getJSONObject("content")
                      .getJSONArray("parts")
                      .getJSONObject(0)
                      .getString("text")
                      .trim()
              }

              override fun onDestroy() {
                  virtualDisplay?.release()
                  mediaProjection?.stop()
                  if (::wm.isInitialized) wm.removeView(frameLayout)
                  super.onDestroy()
              }
          }
          """
          with open("app/src/main/java/com/example/gametranslator/MainActivity.kt", "w") as f:
              f.write(code.strip())
          '

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaminik-AI-Free-APK
          path: app/build/outputs/apk/debug/app-debug.apk

